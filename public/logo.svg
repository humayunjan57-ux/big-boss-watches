<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB0" />
      <stop offset="35%" stop-color="#DFBA4E" />
      <stop offset="70%" stop-color="#C9A227" />
      <stop offset="100%" stop-color="#FCE59F" />
    </linearGradient>
    <linearGradient id="logoGoldBright" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A227" />
      <stop offset="50%" stop-color="#FFF3C4" />
      <stop offset="100%" stop-color="#C9A227" />
    </linearGradient>
    <filter id="logoGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C9A227" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left Emblem Box -->
  <g transform="translate(16, 16)">
    <rect width="128" height="128" rx="20" fill="#121212" stroke="url(#logoGold)" stroke-width="2" />
    <!-- Inner Watch Bezel Circle -->
    <circle cx="64" cy="64" r="52" fill="#0A0A0A" stroke="#C9A227" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="64" cy="64" r="46" fill="none" stroke="#C9A227" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.3" />

    <!-- Crown Icon inside Emblem -->
    <g filter="url(#logoGlow)" transform="translate(64, 46) scale(0.65) translate(-64, -46)">
      <path d="M 38 66 L 90 66 L 86 74 L 42 74 Z" fill="url(#logoGoldBright)" />
      <path d="M 38 63 L 32 32 L 50 48 L 64 20 L 78 48 L 96 32 L 90 63 Z" fill="url(#logoGold)" />
      <circle cx="32" cy="30" r="4" fill="url(#logoGoldBright)" />
      <circle cx="50" cy="46" r="3.5" fill="url(#logoGoldBright)" />
      <circle cx="64" cy="18" r="5" fill="url(#logoGoldBright)" />
      <circle cx="78" cy="46" r="3.5" fill="url(#logoGoldBright)" />
      <circle cx="96" cy="30" r="4" fill="url(#logoGoldBright)" />
    </g>

    <!-- BB Monogram -->
    <text x="64" y="96" fill="url(#logoGoldBright)" font-family="'Cinzel', serif" font-size="20" font-weight="800" letter-spacing="2" text-anchor="middle">BB</text>
    <text x="65" y="108" fill="#C9A227" font-family="'Space Grotesk', sans-serif" font-size="6.5" font-weight="700" letter-spacing="3" text-anchor="middle">GENEVA</text>
  </g>

  <!-- Typography: BIG BOSS WATCHES -->
  <g transform="translate(170, 0)">
    <text x="0" y="74" fill="#FFFFFF" font-family="'Cinzel', serif" font-size="46" font-weight="700" letter-spacing="6">BIG BOSS</text>
    <text x="3" y="106" fill="url(#logoGoldBright)" font-family="'Cinzel', serif" font-size="18" font-weight="600" letter-spacing="8">WATCHES</text>
    <text x="180" y="105" fill="#888888" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="500" letter-spacing="4">GENEVA ATELIER</text>
    
    <!-- Divider Line -->
    <line x1="3" y1="120" x2="420" y2="120" stroke="url(#logoGold)" stroke-width="1" stroke-opacity="0.4" />
    <text x="3" y="136" fill="#C9A227" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="600" letter-spacing="5">TIME, REDEFINED • PRECISION • POWER • PRESTIGE</text>
  </g>
</svg>
