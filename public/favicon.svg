<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB0" />
      <stop offset="30%" stop-color="#DFBA4E" />
      <stop offset="60%" stop-color="#C9A227" />
      <stop offset="85%" stop-color="#9E7C18" />
      <stop offset="100%" stop-color="#FCE59F" />
    </linearGradient>
    <linearGradient id="goldBright" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A227" />
      <stop offset="50%" stop-color="#FFF3C4" />
      <stop offset="100%" stop-color="#C9A227" />
    </linearGradient>
    <radialGradient id="dialGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1815" />
      <stop offset="70%" stop-color="#0E0D0C" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#C9A227" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Luxury Frame for App & Browser Icon -->
  <rect width="512" height="512" rx="112" fill="#0A0A0A" />

  <!-- Outer Bezel Ring (Watch Case Inspiration) -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGradient)" stroke-width="8" />
  <circle cx="256" cy="256" r="222" fill="none" stroke="#050505" stroke-width="4" />
  <circle cx="256" cy="256" r="216" fill="url(#dialGradient)" stroke="url(#goldGradient)" stroke-width="2" />

  <!-- Guilloché Fine Inner Rings -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#C9A227" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4" />
  <circle cx="256" cy="256" r="155" fill="none" stroke="#C9A227" stroke-width="1" stroke-opacity="0.2" />

  <!-- 12 Horology Hour Pips -->
  <g fill="url(#goldBright)">
    <rect x="253" y="46" width="6" height="14" rx="2" />
    <circle cx="361" cy="74" r="4" />
    <circle cx="438" cy="151" r="4" />
    <rect x="452" y="253" width="14" height="6" rx="2" />
    <circle cx="438" cy="361" r="4" />
    <circle cx="361" cy="438" r="4" />
    <rect x="253" y="452" width="6" height="14" rx="2" />
    <circle cx="151" cy="438" r="4" />
    <circle cx="74" cy="361" r="4" />
    <rect x="46" y="253" width="14" height="6" rx="2" />
    <circle cx="74" cy="151" r="4" />
    <circle cx="151" cy="74" r="4" />
  </g>

  <!-- Big Boss Imperial Crown -->
  <g filter="url(#goldGlow)">
    <!-- Crown Base Band -->
    <path d="M 176 250 L 336 250 L 330 264 L 182 264 Z" fill="url(#goldBright)" />
    <!-- Crown Jewels on Band -->
    <circle cx="216" cy="257" r="3" fill="#0A0A0A" />
    <circle cx="256" cy="257" r="3.5" fill="#0A0A0A" />
    <circle cx="296" cy="257" r="3" fill="#0A0A0A" />

    <!-- Crown Peaks -->
    <path d="M 176 244 
             L 160 178 
             L 210 208 
             L 256 142 
             L 302 208 
             L 352 178 
             L 336 244 Z" 
          fill="url(#goldGradient)" />

    <!-- Crown Finial Jewels (Top Balls) -->
    <circle cx="160" cy="174" r="7" fill="url(#goldBright)" />
    <circle cx="210" cy="205" r="6" fill="url(#goldBright)" />
    <circle cx="256" cy="138" r="9" fill="url(#goldBright)" />
    <circle cx="302" cy="205" r="6" fill="url(#goldBright)" />
    <circle cx="352" cy="174" r="7" fill="url(#goldBright)" />
  </g>

  <!-- Interlocking / Bold BB Luxury Monogram -->
  <g fill="url(#goldBright)" filter="url(#goldGlow)" style="font-family: 'Cinzel', 'Times New Roman', serif; font-weight: 800;">
    <text x="256" y="348" font-size="78" letter-spacing="4" text-anchor="middle">BB</text>
  </g>

  <!-- Brand Subtext GENEVA -->
  <g fill="#DFBA4E" style="font-family: 'Space Grotesk', 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 9px;">
    <text x="261" y="385" text-anchor="middle">GENEVA</text>
  </g>

  <!-- Subtle Bottom Star / Horology Diamond -->
  <polygon points="256,400 260,406 266,406 262,410 264,416 256,412 248,416 250,410 246,406 252,406" fill="url(#goldBright)" />
</svg>
