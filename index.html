    <!-- Instant 0ms Pre-Hydration Branding Synchronization -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('bbw_cached_store_settings');
          if (raw) {
            var s = JSON.parse(raw);
            if (s && s.brandTitle) {
              document.title = s.brandTitle + (s.brandSubtitle ? ' – ' + s.brandSubtitle : ' – TIME, REDEFINED');
            }
            if (s && s.logoUrl && s.logoUrl.trim()) {
              var links = document.querySelectorAll("link[rel*='icon']");
              links.forEach(function(l) { l.href = s.logoUrl.trim(); });
            }
          }
        } catch(e) {}
      })();
    </script>
